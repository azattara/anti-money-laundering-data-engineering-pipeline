name: 'anti_money_laundering'
version: '1.0.0'
config-version: 2

profile: 'anti_money_laundering'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  anti_money_laundering:
    bronze:
      +materialized: view
      +schema: aml_bronze
    silver:
      +materialized: table
      +schema: aml_silver
    gold:
      # Default to incremental for all Gold models; individual models can override.
      +materialized: incremental
      +schema: aml_gold
      # BigQuery partitioning and clustering defaults for all Gold models.
      +partition_by:
        field: feature_date
        data_type: date
        granularity: day
      +cluster_by:
        - customer_id
