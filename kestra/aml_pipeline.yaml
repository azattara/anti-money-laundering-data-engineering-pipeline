id: aml_medallion_pipeline
namespace: anti_money_laundering

description: |
  IBM Anti Money Laundering — Medallion Architecture Pipeline (Bronze / Silver / Gold)

  Execution modes:
    - INCREMENTAL (default): processes only new data for the given partition_date.
    - FULL_REFRESH: reprocesses all Bronze data (WRITE_TRUNCATE in Silver,
      dbt full-refresh in Gold).

  Pre-requisite:
    Upload raw CSV files to the GCS Bronze bucket before triggering this pipeline:
      - INCREMENTAL: gs://<gcs_bronze_bucket>/partitions/<partition_date>/*.csv
      - FULL_REFRESH: gs://<gcs_bronze_bucket>/raw/*.csv

  Steps:
    1. Bronze  — Load CSV files from GCS Bronze bucket into BigQuery (aml_bronze.transactions)
    2. Silver  — Run PySpark job for the specific date partition(s)
    3. Gold    — Run dbt incremental (or full-refresh) for feature store

labels:
  project: anti-money-laundering
  env: production
  layer: medallion

inputs:
  - id: gcs_bronze_bucket
    type: STRING
    defaults: anti-ml-data-engineering-bronze
    description: "GCS Bronze bucket name"

  - id: gcs_silver_bucket
    type: STRING
    defaults: anti-ml-data-engineering-silver
    description: "GCS Silver bucket name"

  - id: gcp_project_id
    type: STRING
    defaults: anti-ml-data-engineering
    description: "GCP Project ID"

  - id: gcp_region
    type: STRING
    defaults: us-central1
    description: "GCP region where Dataproc Batches will run"

  - id: partition_date
    type: STRING
    defaults: "{{ now() | dateAdd(-1, 'DAYS') | date('yyyy-MM-dd') }}"
    description: "Date partition to process (YYYY-MM-DD). Defaults to yesterday."

  - id: run_mode
    type: STRING
    defaults: INCREMENTAL
    description: "INCREMENTAL or FULL_REFRESH"

variables:
  gcs_partition_prefix: "partitions/{{ inputs.partition_date }}"

tasks:

  # ──────────────────────────────────────────────────────────────────────────
  # BRONZE — Step 1: Load CSV files from GCS Bronze bucket into BigQuery
  # ──────────────────────────────────────────────────────────────────────────
  - id: bronze_gcs_to_bq
    type: io.kestra.plugin.scripts.python.Script
    description: "Load CSV files from GCS Bronze into BigQuery aml_bronze.transactions"
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    beforeCommands:
      - pip install --quiet google-cloud-bigquery
    env:
      GCP_PROJECT_ID: "{{ inputs.gcp_project_id }}"
      GCS_BRONZE_BUCKET: "{{ inputs.gcs_bronze_bucket }}"
      GCS_PREFIX: "{{ inputs.run_mode == 'FULL_REFRESH' ? 'raw' : vars.gcs_partition_prefix }}"
      RUN_MODE: "{{ inputs.run_mode }}"
      GOOGLE_APPLICATION_CREDENTIALS: "{{ kv('GCP_SA_KEY_PATH') }}"
    script: |
      import os, logging
      from google.cloud import bigquery

      logging.basicConfig(level=logging.INFO, format='%(asctime)s [%(levelname)s] %(message)s')
      logger = logging.getLogger(__name__)

      project_id = os.environ['GCP_PROJECT_ID']
      bucket     = os.environ['GCS_BRONZE_BUCKET']
      prefix     = os.environ['GCS_PREFIX']
      run_mode   = os.environ['RUN_MODE']
      table_id   = f"{project_id}.aml_bronze.transactions"
      source_uri = f"gs://{bucket}/{prefix}/*.csv"

      write_disp = (
          bigquery.WriteDisposition.WRITE_TRUNCATE
          if run_mode == 'FULL_REFRESH'
          else bigquery.WriteDisposition.WRITE_APPEND
      )

      client = bigquery.Client(project=project_id)
      job_config = bigquery.LoadJobConfig(
          source_format=bigquery.SourceFormat.CSV,
          skip_leading_rows=1,
          autodetect=True,
          write_disposition=write_disp,
          create_disposition=bigquery.CreateDisposition.CREATE_IF_NEEDED,
      )

      logger.info("Loading from %s → %s (mode: %s)", source_uri, table_id, run_mode)
      load_job = client.load_table_from_uri(source_uri, table_id, job_config=job_config)
      load_job.result()

      table = client.get_table(table_id)
      logger.info("Load complete. Table '%s' now has %d rows.", table_id, table.num_rows)

  # ──────────────────────────────────────────────────────────────────────────
  # SILVER — Step 2a: Submit PySpark cleaning job to Dataproc (INCREMENTAL)
  # ──────────────────────────────────────────────────────────────────────────
  - id: silver_spark_dataproc_incremental
    type: io.kestra.plugin.gcp.dataproc.batches.PySparkSubmit
    description: "Submit PySpark Silver job to Dataproc Batches for partition {{ inputs.partition_date }} — incremental"
    runIf: "{{ inputs.run_mode != 'FULL_REFRESH' }}"
    projectId: "{{ inputs.gcp_project_id }}"
    region: "{{ inputs.gcp_region }}"
    name: "aml-silver-incremental-{{ inputs.partition_date }}"
    serviceAccount: "{{ kv('GCP_SA_EMAIL') }}"
    mainPythonFileUri: "gs://{{ kv('GCS_ARTIFACTS_BUCKET') }}/spark/clean_aml_data.py"
    args:
      - "--partition-date"
      - "{{ inputs.partition_date }}"
    jarFileUris:
      - "gs://spark-lib/bigquery/spark-bigquery-with-dependencies_2.12-0.34.0.jar"

  # ──────────────────────────────────────────────────────────────────────────
  # SILVER — Step 2b: Submit PySpark cleaning job to Dataproc (FULL_REFRESH)
  # ──────────────────────────────────────────────────────────────────────────
  - id: silver_spark_dataproc_full_refresh
    type: io.kestra.plugin.gcp.dataproc.batches.PySparkSubmit
    description: "Submit PySpark Silver job to Dataproc Batches — FULL_REFRESH (all partitions)"
    runIf: "{{ inputs.run_mode == 'FULL_REFRESH' }}"
    projectId: "{{ inputs.gcp_project_id }}"
    region: "{{ inputs.gcp_region }}"
    name: "aml-silver-full-refresh-{{ inputs.partition_date }}"
    serviceAccount: "{{ kv('GCP_SA_EMAIL') }}"
    mainPythonFileUri: "gs://{{ kv('GCS_ARTIFACTS_BUCKET') }}/spark/clean_aml_data.py"
    args:
      - "--full-refresh"
      - "--partition-date"
      - "{{ inputs.partition_date }}"
    jarFileUris:
      - "gs://spark-lib/bigquery/spark-bigquery-with-dependencies_2.12-0.34.0.jar"

  # ──────────────────────────────────────────────────────────────────────────
  # GOLD — Step 3: Run dbt feature store models (incremental or full-refresh)
  # ──────────────────────────────────────────────────────────────────────────
  - id: gold_dbt_run
    type: io.kestra.plugin.scripts.shell.Commands
    description: "Run dbt Gold feature store models"
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    env:
      DBT_PROFILES_DIR: /app/dbt
      GOOGLE_APPLICATION_CREDENTIALS: "{{ kv('GCP_SA_KEY_PATH') }}"
      GCP_PROJECT_ID: "{{ inputs.gcp_project_id }}"
    commands:
      - |
        cd /app/dbt
        if [ "{{ inputs.run_mode }}" = "FULL_REFRESH" ]; then
          dbt run --full-refresh \
            --select fct_transactions_silver mart_customer_features_gold feature_store_customer_features
        else
          dbt run \
            --select fct_transactions_silver mart_customer_features_gold feature_store_customer_features
        fi

  # ──────────────────────────────────────────────────────────────────────────
  # GOLD — Step 4: Run dbt tests on feature store output
  # ──────────────────────────────────────────────────────────────────────────
  - id: gold_dbt_test
    type: io.kestra.plugin.scripts.shell.Commands
    description: "Run dbt tests on Silver and Gold models"
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    env:
      DBT_PROFILES_DIR: /app/dbt
      GOOGLE_APPLICATION_CREDENTIALS: "{{ kv('GCP_SA_KEY_PATH') }}"
      GCP_PROJECT_ID: "{{ inputs.gcp_project_id }}"
    commands:
      - |
        cd /app/dbt
        dbt test --select fct_transactions_silver mart_customer_features_gold feature_store_customer_features

errors:
  - id: notify_on_failure
    type: io.kestra.plugin.core.log.Log
    message: |
      Pipeline FAILED for partition {{ inputs.partition_date }} (mode: {{ inputs.run_mode }}).
      Check task logs above for details.
